<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Create Parking Lot - Vehicle Parking{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    {% block content %}
        <h1>Create New Parking Lot</h1>
        <form method="POST">
            <div>
                <label for="name">Location Name</label><br>
                <input type="text" id="name" name="name" required>
            </div>
            <br>
            <div>
                <label for="price">Price per Hour ($)</label><br>
                <input type="number" step="0.01" id="price" name="price" required>
            </div>
            <br>
            <div>
                <label for="address">Address</label><br>
                <textarea id="address" name="address" rows="3" required></textarea>
            </div>
            <br>
            <div>
                <label for="pin_code">Pin Code</label><br>
                <input type="text" id="pin_code" name="pin_code" required>
            </div>
            <br>
            <div>
                <label for="max_spots">Maximum Number of Spots</label><br>
                <input type="number" id="max_spots" name="max_spots" min="1" required>
                <p><small>Parking spots will be created automatically based on this number.</small></p>
            </div>
            <br>
            <button type="submit">Create Parking Lot</button>
            <a href="{{ url_for('admin_dashboard') }}">Cancel</a>
        </form>
    {% endblock %}
</body>
</html>
